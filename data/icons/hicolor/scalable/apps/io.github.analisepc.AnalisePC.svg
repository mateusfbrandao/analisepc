<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Gradiente sutil apenas em superfícies curvas/metálicas conforme GNOME HIG app-icons.html -->
    <linearGradient id="chassis_front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d3846"/>
      <stop offset="100%" stop-color="#241f31"/>
    </linearGradient>
    <linearGradient id="chassis_top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5e5c64"/>
      <stop offset="100%" stop-color="#3d3846"/>
    </linearGradient>
    <linearGradient id="screen_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1726"/>
      <stop offset="100%" stop-color="#241f31"/>
    </linearGradient>
    <linearGradient id="pulse_fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#33d17a" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#3584e4" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="pin_gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6d32d"/>
      <stop offset="100%" stop-color="#e5a50a"/>
    </linearGradient>
  </defs>

  <!-- Pinos metálicos do processador/placa (Grid de 2px da GNOME HIG) -->
  <!-- Topo -->
  <rect x="32" y="6" width="8" height="12" rx="2" fill="url(#pin_gold)"/>
  <rect x="48" y="6" width="8" height="12" rx="2" fill="url(#pin_gold)"/>
  <rect x="72" y="6" width="8" height="12" rx="2" fill="url(#pin_gold)"/>
  <rect x="88" y="6" width="8" height="12" rx="2" fill="url(#pin_gold)"/>
  <!-- Base (com perfil frontal escuro #b5835a) -->
  <rect x="32" y="110" width="8" height="12" rx="2" fill="#e5a50a"/>
  <rect x="48" y="110" width="8" height="12" rx="2" fill="#e5a50a"/>
  <rect x="72" y="110" width="8" height="12" rx="2" fill="#e5a50a"/>
  <rect x="88" y="110" width="8" height="12" rx="2" fill="#e5a50a"/>
  <!-- Esquerda -->
  <rect x="6" y="32" width="12" height="8" rx="2" fill="url(#pin_gold)"/>
  <rect x="6" y="48" width="12" height="8" rx="2" fill="url(#pin_gold)"/>
  <rect x="6" y="72" width="12" height="8" rx="2" fill="url(#pin_gold)"/>
  <rect x="6" y="88" width="12" height="8" rx="2" fill="url(#pin_gold)"/>
  <!-- Direita -->
  <rect x="110" y="32" width="12" height="8" rx="2" fill="url(#pin_gold)"/>
  <rect x="110" y="48" width="12" height="8" rx="2" fill="url(#pin_gold)"/>
  <rect x="110" y="72" width="12" height="8" rx="2" fill="url(#pin_gold)"/>
  <rect x="110" y="88" width="12" height="8" rx="2" fill="url(#pin_gold)"/>

  <!-- Perfil frontal inferior 3D (4px de altura conforme HIG Perspective) -->
  <rect x="14" y="18" width="100" height="96" rx="18" fill="url(#chassis_front)"/>

  <!-- Superfície superior do encapsulamento -->
  <rect x="14" y="14" width="100" height="96" rx="18" fill="url(#chassis_top)"/>

  <!-- Borda iluminada superior (luz vinda de cima conforme HIG Shadows & Highlights) -->
  <rect x="15" y="15" width="98" height="94" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>

  <!-- Visor interno de telemetria e diagnóstico -->
  <rect x="24" y="24" width="80" height="76" rx="12" fill="url(#screen_bg)"/>
  <rect x="24" y="24" width="80" height="76" rx="12" fill="none" stroke="#1c71d8" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Grade técnica sutil no visor (múltiplos de 2px) -->
  <line x1="26" y1="48" x2="102" y2="48" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>
  <line x1="26" y1="68" x2="102" y2="68" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>
  <line x1="26" y1="88" x2="102" y2="88" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>
  <line x1="52" y1="26" x2="52" y2="98" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>
  <line x1="76" y1="26" x2="76" y2="98" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>

  <!-- Indicadores de status no topo do visor (Paleta GNOME: Blue 3, Green 3, Yellow 4) -->
  <circle cx="34" cy="34" r="3" fill="#3584e4"/>
  <circle cx="44" cy="34" r="3" fill="#33d17a"/>
  <circle cx="54" cy="34" r="3" fill="#f6d32d"/>
  <rect x="74" y="31" width="20" height="6" rx="3" fill="#3584e4" fill-opacity="0.45"/>

  <!-- Área preenchida sob a curva de telemetria -->
  <path d="M 28 84 L 42 84 L 50 70 L 58 88 L 68 46 L 78 76 L 86 62 L 96 62 L 96 96 L 28 96 Z" fill="url(#pulse_fill)"/>

  <!-- Curva de telemetria / pulso de hardware (GNOME Green 3 #33d17a) -->
  <path d="M 28 84 L 42 84 L 50 70 L 58 88 L 68 46 L 78 76 L 86 62 L 96 62"
        fill="none"
        stroke="#33d17a"
        stroke-width="4"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Ponto ativo de leitura com halo -->
  <circle cx="96" cy="62" r="6" fill="#33d17a" fill-opacity="0.30"/>
  <circle cx="96" cy="62" r="3" fill="#8ff0a4"/>
</svg>
