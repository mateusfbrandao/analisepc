<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Ícone Simbólico 16x16 seguindo a mesma metáfora do ícone principal (GNOME HIG Symbolic Icons) -->
  <g fill="#2e3436">
    <!-- Pinos superiores e inferiores -->
    <rect x="4" y="0" width="2" height="2" rx="0.5"/>
    <rect x="7" y="0" width="2" height="2" rx="0.5"/>
    <rect x="10" y="0" width="2" height="2" rx="0.5"/>
    <rect x="4" y="14" width="2" height="2" rx="0.5"/>
    <rect x="7" y="14" width="2" height="2" rx="0.5"/>
    <rect x="10" y="14" width="2" height="2" rx="0.5"/>
    <!-- Pinos laterais -->
    <rect x="0" y="4" width="2" height="2" rx="0.5"/>
    <rect x="0" y="7" width="2" height="2" rx="0.5"/>
    <rect x="0" y="10" width="2" height="2" rx="0.5"/>
    <rect x="14" y="4" width="2" height="2" rx="0.5"/>
    <rect x="14" y="7" width="2" height="2" rx="0.5"/>
    <rect x="14" y="10" width="2" height="2" rx="0.5"/>
    <!-- Moldura do chip -->
    <path d="M 4 2 C 2.892 2 2 2.892 2 4 L 2 12 C 2 13.108 2.892 14 4 14 L 12 14 C 13.108 14 14 13.108 14 12 L 14 4 C 14 2.892 13.108 2 12 2 L 4 2 z M 4 4 L 12 4 L 12 12 L 4 12 L 4 4 z"/>
    <!-- Pulso de telemetria interno -->
    <path d="M 4.5 9.5 L 6 9.5 L 7.2 6 L 8.8 10.5 L 10 8 L 11.5 8"
          fill="none"
          stroke="#2e3436"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>
</svg>
