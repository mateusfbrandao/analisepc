<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Paleta oficial da GNOME HIG (developer.gnome.org/hig/guidelines/app-icons.html) -->
    <!-- Dark 4 (#241f31), Dark 3 (#3d3846), Dark 2 (#5e5c64), Blue 4 (#1c71d8), Blue 3 (#3584e4), Green 3 (#33d17a), Green 2 (#57e389), Yellow 3 (#f6d32d), Yellow 5 (#e5a50a) -->
    <linearGradient id="bg-shadow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#241f31"/>
      <stop offset="50%" stop-color="#3d3846"/>
      <stop offset="100%" stop-color="#241f31"/>
    </linearGradient>
    <linearGradient id="bg-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5e5c64"/>
      <stop offset="100%" stop-color="#3d3846"/>
    </linearGradient>
    <linearGradient id="chip-die" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241f31"/>
      <stop offset="100%" stop-color="#1a1624"/>
    </linearGradient>
    <linearGradient id="pin-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6d32d"/>
      <stop offset="100%" stop-color="#e5a50a"/>
    </linearGradient>
    <linearGradient id="wave-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#33d17a" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#3584e4" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="wave-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3584e4"/>
      <stop offset="55%" stop-color="#33d17a"/>
      <stop offset="100%" stop-color="#57e389"/>
    </linearGradient>
  </defs>

  <!-- Perfil frontal inferior 3D (4px nominal de profundidade conforme GNOME HIG Perspective) -->
  <rect x="12" y="16" width="104" height="100" rx="22" fill="url(#bg-shadow)"/>

  <!-- Superfície superior do chassi (alinhada ao grid de 2px da GNOME HIG) -->
  <rect x="12" y="12" width="104" height="100" rx="22" fill="url(#bg-surface)"/>

  <!-- Realce de iluminação superior (luz apontando de cima conforme HIG Shadows & Highlights) -->
  <rect x="13" y="13" width="102" height="98" rx="21" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>

  <!-- Contatos dourados do processador (Paleta GNOME Yellow 3 / Yellow 5) -->
  <g fill="url(#pin-gold)">
    <!-- Topo -->
    <rect x="40" y="20" width="6" height="10" rx="2"/>
    <rect x="54" y="20" width="6" height="10" rx="2"/>
    <rect x="68" y="20" width="6" height="10" rx="2"/>
    <rect x="82" y="20" width="6" height="10" rx="2"/>
    <!-- Base -->
    <rect x="40" y="94" width="6" height="10" rx="2"/>
    <rect x="54" y="94" width="6" height="10" rx="2"/>
    <rect x="68" y="94" width="6" height="10" rx="2"/>
    <rect x="82" y="94" width="6" height="10" rx="2"/>
    <!-- Esquerda -->
    <rect x="20" y="38" width="10" height="6" rx="2"/>
    <rect x="20" y="52" width="10" height="6" rx="2"/>
    <rect x="20" y="66" width="10" height="6" rx="2"/>
    <rect x="20" y="80" width="10" height="6" rx="2"/>
    <!-- Direita -->
    <rect x="98" y="38" width="10" height="6" rx="2"/>
    <rect x="98" y="52" width="10" height="6" rx="2"/>
    <rect x="98" y="66" width="10" height="6" rx="2"/>
    <rect x="98" y="80" width="10" height="6" rx="2"/>
  </g>

  <!-- Sombra interna do visor central -->
  <rect x="28" y="30" width="72" height="66" rx="14" fill="#13101c"/>
  <!-- Corpo central do Chip / Visor de Telemetria -->
  <rect x="28" y="28" width="72" height="66" rx="14" fill="url(#chip-die)" stroke="#3584e4" stroke-width="2"/>

  <!-- Indicadores semânticos no topo do visor (Blue 3, Green 3, Yellow 3) -->
  <circle cx="38" cy="38" r="2.5" fill="#3584e4"/>
  <circle cx="46" cy="38" r="2.5" fill="#33d17a"/>
  <circle cx="54" cy="38" r="2.5" fill="#f6d32d"/>

  <!-- Grade técnica sutil de telemetria -->
  <line x1="34" y1="50" x2="94" y2="50" stroke="#5e5c64" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="34" y1="74" x2="94" y2="74" stroke="#5e5c64" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Preenchimento sob a curva -->
  <path d="M 36 68 L 48 68 L 55 46 L 63 80 L 72 52 L 79 64 L 90 64 L 90 88 L 36 88 Z" fill="url(#wave-fill)"/>

  <!-- Pulso de Telemetria / Diagnóstico em Tempo Real -->
  <path d="M 36 68 L 48 68 L 55 46 L 63 80 L 72 52 L 79 64 L 90 64"
        fill="none"
        stroke="url(#wave-grad)"
        stroke-width="4.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Ponto luminoso de leitura ativa -->
  <circle cx="90" cy="64" r="8" fill="#57e389" fill-opacity="0.24"/>
  <circle cx="90" cy="64" r="4" fill="#8ff0a4"/>
</svg>
